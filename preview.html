<!doctype html><meta charset=utf-8><title>README preview</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{color-scheme:light dark}
body{margin:0;background:#fff;color:#1f2328;
 font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#r{max-width:880px;margin:0 auto;padding:32px 16px 80px}
img{max-width:100%}
h3{margin:24px 0 8px;font-size:1.25em}
table{border-collapse:collapse;width:100%;margin:16px 0;display:block;overflow:auto}
th,td{border:1px solid #d1d9e0;padding:8px 13px;text-align:left;vertical-align:top}
tr:nth-child(2n){background:#f6f8fa}
pre{background:#f6f8fa;padding:16px;border-radius:6px;overflow:auto;font-size:85%}
code{background:#eff1f3;padding:.2em .4em;border-radius:6px;font-size:85%}
pre code{background:none;padding:0}
hr{border:0;border-top:1px solid #d1d9e0;margin:24px 0}
a{color:#0969da;text-decoration:none}
sub{color:#59636e}
p{margin:0 0 16px}
@media(prefers-color-scheme:dark){
 body{background:#0d1117;color:#e6edf3}
 th,td{border-color:#3d444d} tr:nth-child(2n){background:#151b23}
 pre{background:#151b23} code{background:#262c36} hr{border-color:#3d444d}
 a{color:#4493f8} sub{color:#9198a1}}
</style>
<div id=r>loading…</div>
<script>
fetch('README.md?'+Date.now()).then(r=>r.text()).then(t=>{
  t = t.replaceAll('https://raw.githubusercontent.com/prince-raveled/prince-raveled/main/','');
  t = t.replaceAll('https://raw.githubusercontent.com/prince-raveled/prince-raveled/output/snake-dark.svg','');
  t = t.replaceAll('https://raw.githubusercontent.com/prince-raveled/prince-raveled/output/snake.svg','');
  document.getElementById('r').innerHTML = marked.parse(t);
});
</script>
