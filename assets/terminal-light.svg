.w0{animation:w0 22.0s steps(25) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes w0{0%,2.00%{transform:translateX(0)}8.02%,96%{transform:translateX(732px)}97%,100%{transform:translateX(0)}}
