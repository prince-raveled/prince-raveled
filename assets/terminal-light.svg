<rect class="w7" x="30" y="295" width="532" height="32" fill="#16240f"/>
<text x="36" y="352" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" xml:space="preserve"><tspan fill="#9fe07a" fill-opacity=".85">prince@sastra:~/gut-metagenome$ </tspan><tspan fill="#d9ecb4">Rscript sparcc_network.R --r 0.5 --p 0.01</tspan></text>
<rect class="w8" x="30" y="327" width="932" height="32" fill="#16240f"/>
