.w8{animation:w8 22.0s steps(41) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes w8{0%,70.80%{transform:translateX(0)}76.82%,96%{transform:translateX(932px)}97%,100%{transform:translateX(0)}}
.w9{animation:w9 22.0s steps(37) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes w9{0%,79.40%{transform:translateX(0)}85.42%,96%{transform:translateX(506px)}97%,100%{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#9fe07a" fill-opacity=".05"/></pattern><clipPath id="win"><rect width="1200" height="460" rx="18"/></clipPath></defs>
