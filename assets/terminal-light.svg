<rect class="w4" x="30" y="199" width="406" height="32" fill="#16240f"/>
<text x="36" y="256" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" xml:space="preserve"><tspan fill="#9fe07a" fill-opacity=".85">prince@sastra:~/gut-metagenome$ </tspan><tspan fill="#d9ecb4">metaphlan clean.fq.gz --input_type fastq --nproc 8 -o profile.tsv</tspan></text>
