@keyframes w5{0%,45.00%{transform:translateX(0)}51.02%,96%{transform:translateX(1232px)}97%,100%{transform:translateX(0)}}
.bar{animation:bar 22.0s linear infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes bar{0%,53.6%{transform:scaleX(0)}66.6%,96%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
.w6{animation:w6 22.0s steps(9) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes w6{0%,53.60%{transform:translateX(0)}59.62%,96%{transform:translateX(594px)}97%,100%{transform:translateX(0)}}
.w7{animation:w7 22.0s steps(39) infinite;transform-box:fill-box;transform-origin:0 50%}
